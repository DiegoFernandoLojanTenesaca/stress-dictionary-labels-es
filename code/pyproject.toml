[project]
name = "experimentos-estres"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.7",
  "transformers>=4.45",
  "accelerate",
  "scikit-learn",
  "pandas",
  "numpy",
  "gensim",
  "scipy",
  "tabulate>=0.10.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
